# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  Kong API Gateway — Declarative Configuration (DB-less mode)                 ║
# ║  Proxy: http://localhost:8000 | Admin: http://localhost:8001                 ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
_format_version: "3.0"

# ══════════════════════════════════════════════════════════════════════════════
# Services
# ══════════════════════════════════════════════════════════════════════════════
services:
  - name: adm-dashboard-service
    url: http://adm-dashboard:8081
    routes:
      - name: adm-dashboard-routes
        paths: ["/adm-dashboard"]
        protocols:
          - http
        strip_path: true

  - name: community-service
    url: http://community:8083
    routes:
      - name: community-routes
        paths: ["/community"]
        protocols:
          - http
        strip_path: true

  - name: geolocalization-service
    url: http://geolocalization:8084
    routes:
      - name: geolocalization-routes
        paths: ["/geolocalization"]
        protocols:
          - http
        strip_path: true

  - name: payments-service
    url: http://payments:8085
    routes:
      - name: payments-routes
        paths: ["/payments"]
        protocols:
          - http
        strip_path: true

  - name: users-service
    url: http://users:8082
    routes:
      - name: users.public
        paths: ["/users/public/"]
        strip_path: true
        protocols:
          - http
          - https
        plugins:
          - name: rate-limiting
            config:
              second: 2 # ⏱️ Máx. 2 requests por segundo
              minute: 15 # Máx. 15 por minuto
              hour: 50 # 🕐 Máx. 100 por hora
              policy: local # Contadores em memória local de cada nó
              limit_by: ip # Limita pelo IP do cliente
              hide_client_headers: true # Oculta headers X-RateLimit-*
            enabled: true

      - name: users.private
        paths: ["/users/"]
        strip_path: true
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              header_names:
                - authorization # Lê o token do header Authorization
              claims_to_verify: [exp] # Verifica se o token não está expirado
              key_claim_name: iss # Usa o campo "iss" do token para identificar o consumer

          - name: rate-limiting
            config:
              second: 5 # ⏱️ Máx. 5 requests por segundo
              minute: 50 # Máx. 50 por minuto
              hour: 150 # 🕐 Máx. 150 por hora
              policy: local # Contadores em memória local de cada nó
              limit_by: consumer # Limita pelo consumer (rotas com auth)
            enabled: true

  - name: stickers-service
    url: http://stickers:8087
    routes:
      - name: stickers-routes
        paths: ["/stickers"]
        protocols:
          - http
        strip_path: true
        plugins:
          - name: jwt
            config:
              header_names:
                - authorization # Lê o token do header Authorization
              claims_to_verify: [exp] # Verifica se o token não está expirado
              key_claim_name: iss # Usa o campo "iss" do token para identificar o consumer

  - name: store-service
    url: http://store:8088
    routes:
      - name: store-routes
        paths: ["/store"]
        protocols:
          - http
        strip_path: true

  # ══════════════════════════════════════════════════════════════════════════════
  # OpenAPI Specs (/v3/api-docs) — Rotas públicas sem plugins
  #
  # prefixo /docs/{service} sem nenhum plugin, mantendo a documentação acessível.
  # ══════════════════════════════════════════════════════════════════════════════
  - name: users-docs
    url: http://users:8082
    routes:
      - name: users-docs-route
        paths: ["/docs/users"]
        strip_path: true
        protocols:
          - http

  - name: adm-dashboard-docs
    url: http://adm-dashboard:8081
    routes:
      - name: adm-dashboard-docs-route
        paths: ["/docs/adm-dashboard"]
        strip_path: true
        protocols:
          - http

  - name: community-docs
    url: http://community:8083
    routes:
      - name: community-docs-route
        paths: ["/docs/community"]
        strip_path: true
        protocols:
          - http

  - name: geolocalization-docs
    url: http://geolocalization:8084
    routes:
      - name: geolocalization-docs-route
        paths: ["/docs/geolocalization"]
        strip_path: true
        protocols:
          - http

  - name: payments-docs
    url: http://payments:8085
    routes:
      - name: payments-docs-route
        paths: ["/docs/payments"]
        strip_path: true
        protocols:
          - http

  - name: stickers-docs
    url: http://stickers:8087
    routes:
      - name: stickers-docs-route
        paths: ["/docs/stickers"]
        strip_path: true
        protocols:
          - http

  - name: store-docs
    url: http://store:8088
    routes:
      - name: store-docs-route
        paths: ["/docs/store"]
        strip_path: true
        protocols:
          - http

  # ══════════════════════════════════════════════════════════════════════════════
  # Swagger UI — Interface unificada de documentação
  # ══════════════════════════════════════════════════════════════════════════════
  - name: docs-ui
    url: http://swagger-ui:8080
    routes:
      - name: docs-ui-route
        paths: ["/docs"]
        strip_path: true
        protocols:
          - http

# ══════════════════════════════════════════════════════════════════════════════
