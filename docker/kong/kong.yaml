# ══════════════════════════════════════════════════════════════════════════════
# Global Plugins — Aplicados a TODAS as rotas
# ══════════════════════════════════════════════════════════════════════════════
plugins:
  - name: prometheus
    config:
      per_consumer: true
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  - name: cors
    config:
      origins:
        - "http://localhost:3000" # frontend (dev)
      credentials: true # Necessário para header Authorization funcionar no browser
      max_age: 3600 # Cache do preflight por 1 hora
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Content-Type
        - Authorization
        - X-Request-Id
